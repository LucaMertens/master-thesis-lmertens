[project]
name = "ood-detection"
version = "0.1.0"
description = "Post-hoc OOD detection pipeline for WayFASTER/GrandTour checkpoints (RQ2/RQ3)."
requires-python = "==3.14.*"
dependencies = [
    "traversability_network",
    "config",
    "scikit-learn>=1.9.0",
    "pandas>=3.0.2",
    "matplotlib",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ood_detection"]

[tool.uv.sources]
traversability_network = { workspace = true }
config = { workspace = true }
