[project]
name = "grandtour_extraction"
version = "0.1.0"
description = "Extract rectified Alphasense images + extrinsics from GrandTour bags and call depth generation."
requires-python = "==3.14.*"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
    "opencv-python-headless",
    "rosbags>=0.11.2",
    "tqdm",
    "data_labeling_pipeline",
    "shared-utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grandtour_extraction"]

[tool.uv.sources]
data_labeling_pipeline = { workspace = true }
shared-utils = { workspace = true }
