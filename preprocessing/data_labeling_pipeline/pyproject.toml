[project]
name = "data_labeling_pipeline"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "jupyter",
    "pathlib",
    "matplotlib",
    "numpy",
    "scipy",
    "tqdm",
    "shared-utils",
    "config",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "rosbags>=0.11.2",
    "kleinkram>=0.59.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_labeling_pipeline", "src/simple_baseline_labels"]

[tool.uv.sources]
shared-utils = { workspace = true }
config = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
