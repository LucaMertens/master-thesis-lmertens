TAG: 'wvn_dino'

# WVN-OOD training config: grandtour_dino.yaml plus the WVN pull-to-zero loss.

OPTIMIZER:
    LR: 0.0001
    LR_REF_BATCHSIZE: 12
    WEIGHT_DECAY: 0.0001

TRAINING:
    BATCHSIZE: 8
    WORKERS: 12
    DEVICES: [3]        # set per launch to the free GPUs (1-2 max; 0-2 occupied by others 2026-07-19)
    EPOCHS: 50
    VERBOSE: False
    GAMMA: 0.998
    DEPTH_WEIGHT: 0.05
    HORIZON: 300
    DT: 0.1
    VIS_INTERVAL: 500
    DEBUG_VIS_LABELS: True
    DEBUG_VIS_GEOM: False
    DEBUG_VIS_DEPTH: False

MODEL:
    BACKBONE: 'dino'
    DINO_MODEL: 'facebook/dinov3-vitb16-pretrain-lvd1689m'
    DINO_FEAT_DIM: 768
    DINO_INPUT_SIZE: [480, 352]
    DINO_NECK_DIM: 256
    TIME_LENGTH: 4
    DOWNSAMPLE: 8
    LATENT_DIM: 64
    INPUT_SIZE: [480, 360]
    PREDICT_DEPTH: True
    TRAIN_DEPTH: True
    FUSE_PCLOUD: True
    VOXEL_DEPTH_DOWNSAMPLE: 1
    LABEL_COLUMNS: [0, 1]
    GRID_BOUNDS: {
        'xbound': [-2.0, 8.0, 0.1],
        'ybound': [-5.0, 5.0, 0.1],
        'zbound': [-1.5, 1.5, 0.2],
        'dbound': [ 0.3, 8.0, 0.2]}

WVN:
    GATE_PATH: 'side_experiments/wvn_loss_network/output/gate.npz'
    TAU_QUANTILE: 0.95
    MIN_CELLS: 20
    WEIGHT: 0.05
    VIS_MIN: 0.5
    MAX_DIST: 6.0
    Z_MAX: 0.5

DATASET:
    DATA_ROOT: '/datahome/lmertens/grand_tour_dataset/extracted'
    LABELS_ROOT: '/datahome/lmertens/grand_tour_dataset/labels'
    RESIZED_ROOT: '/datalocal/lmertens/grand_tour_dataset_resized'
    DINO_CACHE_ROOT: '/datalocal/lmertens/grand_tour_dataset_dino'
    TIME_TOLERANCE: 0.05
    MAX_TIME_GAP: 0.5
    LDS_ALPHA: 0.75
    VISIBILITY_GATE: True
    OVERSAMPLE_FRACTION: 0.25

    TRAIN_MISSIONS: ['ALB-1', 'ALB-2', 'CYN-1', 'HOEB-1', 'LMB-1', 'RIV-1', 'TRIM-1', 'HIL-1', 'KAEB-2', 'KAEB-3', ]
    VALID_MISSIONS: ['ALB-3', 'LMB-2', 'HOEB-2', 'CYN-2']
    TEST_MISSIONS:  ['ALB-3', 'LMB-2', 'HOEB-2', 'CYN-2']
    NEAR_OOD_MISSIONS: ['KAEB-1', 'ROOT-1', 'EIG-1', 'EIG-2', 'PIL-2']
    FAR_OOD_MISSIONS: ['SNOW-1', 'SNOW-2', 'SNOW-3', 'ARC-1', 'ARC-2', 'ARC-3', 'ARC-4']

AUGMENTATIONS:
    HORIZ_FLIP: 0.5
    PCLOUD_DROPOUT: 0.3
    MAX_TRANSLATION: 0.5
    MAX_ROTATION: 0.2
    COLOR_JITTER: [0.0, 0.0, 0.0, 0.0]
