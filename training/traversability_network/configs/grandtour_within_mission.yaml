TAG: 'gt_within_mission'
DESCRIPTION: 'Within-mission split, EXACT s5_t6 recipe (identical to gt_baseline_f2 apart from DATASET splits): validation is cut out of missions that are also trained on, so validation terrain is familiar. Tests whether cross-site generalization is the binding constraint.'

OPTIMIZER:
    LR: 0.0001
    LR_REF_BATCHSIZE: 12   # effective batch (BATCHSIZE * GPUs) LR was tuned at; sqrt-scaled from here
    WEIGHT_DECAY: 0.0001
    BACKBONE_LR_FACTOR: 1.0

TRAINING:
    BATCHSIZE: 8
    WORKERS: 6          # per DDP process (per GPU); halve to ~6 to use half the machine
    DEVICES: [1]
    EPOCHS: 10
    VAL_CHECK_INTERVAL: 0.25   # 4 checks inside epoch 0, where s5_t6 peaked
    CHECKPOINT_EVERY_N_EPOCHS: 10
    VERBOSE: False
    GAMMA: 1.0
    LOSS_NORM: 'mean'
    DEPTH_WEIGHT: 0.05  # was 0.1: depth CE dominates the shared encoder gradient ~5x
    HORIZON: 300        # 30 s at 10 Hz; for 50s, the  tail mostly supervises invisible cells
    DT: 0.1             # matches RHE timestep
    VIS_INTERVAL: 500
    DEBUG_VIS_LABELS: True  # label mu + gates on camera/BEV panels
    DEBUG_VIS_GEOM: True    # path reprojected into every input frame
    DEBUG_VIS_DEPTH: True   # input depth blended over the anchor RGB

MODEL:
    TIME_LENGTH: 6   # WayFASTER's; with FRAME_STRIDE 5 the window spans its 2.5 s
    DOWNSAMPLE: 8
    LATENT_DIM: 64
    INPUT_SIZE: [480, 360]   # Alphasense native 1440x1080 (4:3), /3 -> 480x360, /8 divisible
    PREDICT_DEPTH: True
    TRAIN_DEPTH: True
    FUSE_PCLOUD: True
    VOXEL_DEPTH_DOWNSAMPLE: 1  # nearest-subsample depth for voxelize (1 = full res)
    LABEL_COLUMNS: [0, 1]    # (mu, nu) columns of rhe_trav_labels.npy
    GRID_BOUNDS: {
        'xbound': [-2.0, 8.0, 0.1],
        'ybound': [-5.0, 5.0, 0.1],
        'zbound': [-1.5, 1.5, 0.2],   # ANYmal is lower, uneven terrain
        'dbound': [ 0.3, 8.0, 0.2]}

DATASET:
    DATA_ROOT: '/datahome/lmertens/grand_tour_dataset/extracted'
    LABELS_ROOT: '/datahome/lmertens/grand_tour_dataset/labels'
    # local-SSD copy of INPUT_SIZE color images (grandtour_extraction's resize_images.py);
    # avoids the NFS bottleneck. /datalocal persists across container rebuilds, unlike /home.
    RESIZED_ROOT: '/datalocal/lmertens/grand_tour_dataset_resized'
    TIME_TOLERANCE: 0.05
    MAX_TIME_GAP: 0.5
    # WayFASTER temporal sampling. Its recordings run at 2.02 Hz, the GrandTour camera at
    # 10 Hz: stride 5 puts the stacked frames 0.5 s apart (WayFASTER 0.495 s) and starts a
    # window every 0.5 s, which also drops the all-but-one-frame window overlap.
    FRAME_STRIDE: 5
    WINDOW_STRIDE: 5
    LDS_ALPHA: 1.0
    VISIBILITY_GATE: False
    OVERSAMPLE_FRACTION: 0.0

    # Within-mission split (figures/data/within_mission_split.py, cache
    # within_mission_split.npz). All 14 ID forest missions train; validation is an
    # interior block cut out of 6 of them, so those appear on both sides with
    # complementary ranges. Timestamps are absolute seconds, null = open end.
    TRAIN_MISSIONS: ['ALB-1', 'ALB-2', 'ALB-3', 'CYN-1', 'CYN-2', 'HIL-1', 'HOEB-1', 'HOEB-2', 'KAEB-2', 'KAEB-3', 'LMB-1', 'LMB-2', 'RIV-1', 'TRIM-1']
    VALID_MISSIONS: ['ALB-1', 'HIL-1', 'KAEB-2', 'KAEB-3', 'RIV-1', 'TRIM-1']
    TEST_MISSIONS:  ['ALB-1', 'HIL-1', 'KAEB-2', 'KAEB-3', 'RIV-1', 'TRIM-1']
    TRAIN_TIME_RANGES: {
        'ALB-1':  [[null, 1731665967.473], [1731666165.923, null]],
        'HIL-1':  [[null, 1730732779.197], [1730732911.797, null]],
        'KAEB-2': [[null, 1731594300.107], [1731594349.607, null]],
        'KAEB-3': [[null, 1731596744.162], [1731597073.224, null]],
        'RIV-1':  [[null, 1730735641.805], [1730736094.730, null]],
        'TRIM-1': [[null, 1731662291.564], [1731662422.877, null]]}
    VALID_TIME_RANGES: {
        'ALB-1':  [1731665967.473, 1731666165.923],
        'HIL-1':  [1730732779.197, 1730732911.797],
        'KAEB-2': [1731594300.107, 1731594349.607],
        'KAEB-3': [1731596744.162, 1731597073.224],
        'RIV-1':  [1730735641.805, 1730736094.730],
        'TRIM-1': [1731662291.564, 1731662422.877]}

AUGMENTATIONS:
    HORIZ_FLIP: 0.5
    PCLOUD_DROPOUT: 0.3
    MAX_TRANSLATION: 0.0
    MAX_ROTATION: 0.0
    COLOR_JITTER: [0.0, 0.0, 0.0, 0.0]
