# hxf3z45m's mitigated config (see grandtour.yaml) with harvesting removed again
# (documentation/low_mu_harvest_bmc.md: stacking harvest with LDS on tightens the
# mu spread further, the opposite of the intended effect) and augmentation
# strengthened: translation/rotation jitter doubled, which only randomizes the
# BEV anchor frame the same real image is projected into (no duplicated
# low-mu locations, unlike harvesting), so it should not reintroduce memorization.
TAG: 'grandtour_v2'

OPTIMIZER:
    LR: 0.0001
    LR_REF_BATCHSIZE: 12   # effective batch (BATCHSIZE * GPUs) LR was tuned at; sqrt-scaled from here
    WEIGHT_DECAY: 0.0001
    BACKBONE_LR_FACTOR: 0.1  # pretrained ResNet stages learn 10x slower than the fresh heads

TRAINING:
    BATCHSIZE: 16
    WORKERS: 12         # per DDP process (per GPU); halve to ~6 to use half the machine
    DEVICES: [1, 2, 3]  # -1 = all GPUs; set e.g. 2 to use N GPUs, or a list like this to pin specific ones
    EPOCHS: 50          # early stopping (patience 10 on valid/trav_loss) usually ends the run sooner
    VERBOSE: False
    GAMMA: 0.998
    DEPTH_WEIGHT: 0.05  # was 0.1: depth CE dominates the shared encoder gradient ~5x
    HORIZON: 300        # 30 s at 10 Hz; for 50s, the  tail mostly supervises invisible cells
    DT: 0.1             # matches RHE timestep
    VIS_INTERVAL: 500

MODEL:
    TIME_LENGTH: 4
    DOWNSAMPLE: 8
    LATENT_DIM: 64
    INPUT_SIZE: [480, 360]   # Alphasense native 1440x1080 (4:3), /3 -> 480x360, /8 divisible
    PREDICT_DEPTH: True
    TRAIN_DEPTH: True
    FUSE_PCLOUD: True
    VOXEL_DEPTH_DOWNSAMPLE: 1  # nearest-subsample depth for voxelize (1 = full res)
    LABEL_COLUMNS: [0, 1]    # (mu, nu) columns of rhe_trav_labels.npy
    GRID_BOUNDS: {
        'xbound': [-2.0, 8.0, 0.1],
        'ybound': [-5.0, 5.0, 0.1],
        'zbound': [-1.5, 1.5, 0.2],   # ANYmal is lower, uneven terrain
        'dbound': [ 0.3, 8.0, 0.2]}

DATASET:
    DATA_ROOT: '/datahome/lmertens/grand_tour_dataset/extracted'
    LABELS_ROOT: '/datahome/lmertens/grand_tour_dataset/labels'
    # local-SSD copy of INPUT_SIZE color images (grandtour_extraction's resize_images.py);
    # avoids the NFS bottleneck. /datalocal persists across container rebuilds, unlike /home.
    RESIZED_ROOT: '/datalocal/lmertens/grand_tour_dataset_resized'
    TIME_TOLERANCE: 0.05
    MAX_TIME_GAP: 0.5
    LDS_ALPHA: 0.75          # too high weighting of low-mu events invites memorization
    VISIBILITY_GATE: True    # zero loss weight of horizon cells no input frame can see
    OVERSAMPLE_FRACTION: 0.25  # was 0.4: fewer replicas of the same few low-mu events
    # Harvesting intentionally left off: it repeats the same handful of physical
    # low-mu locations many times per window at full (undiscounted) weight, which
    # compounds with LDS's own inverse-density weighting and tightens the mu
    # spread further instead of fixing generalisation (see low_mu_harvest_bmc.md).

    # OOD-detection split (see documentation/ood_split.md and notebooks/choose_split.ipynb).
    # ID = forest only (natural off-road); a forest-only ID keeps built/snow envs genuinely far.
    # train+val merged; VALID == TEST is the held-out ID set (checkpoint monitor + OOD negative class).
    # KAEB straddles intentionally: KAEB-2/3 in ID (normal Kaeferberg forest), KAEB-1 near-OOD (same forest + entanglement).
    TRAIN_MISSIONS: ['ALB-1', 'ALB-2', 'CYN-1', 'HOEB-1', 'LMB-1', 'RIV-1', 'TRIM-1', 'HIL-1', 'KAEB-2', 'KAEB-3']
    VALID_MISSIONS: ['ALB-3', 'LMB-2', 'HOEB-2', 'CYN-2']
    TEST_MISSIONS:  ['ALB-3', 'LMB-2', 'HOEB-2', 'CYN-2']
    # near-OOD, two tiers: forest shifts (KAEB-1 vegetation, ROOT-1 geometry) + gravel-surfaced mountain (EIG, PIL-2)
    NEAR_OOD_MISSIONS: ['KAEB-1', 'ROOT-1', 'EIG-1', 'EIG-2', 'PIL-2']
    # far-OOD: two contrasting extremes - SNOW (natural/surface) + ARC-1..4 (built/industrial, day runs).
    FAR_OOD_MISSIONS: ['SNOW-1', 'SNOW-2', 'SNOW-3', 'ARC-1', 'ARC-2', 'ARC-3', 'ARC-4']

AUGMENTATIONS:
    HORIZ_FLIP: 0.5
    PCLOUD_DROPOUT: 0.3
    MAX_TRANSLATION: 1.0 #m, was 0.5: only re-anchors the BEV frame, doesn't touch pixels
    MAX_ROTATION: 0.4 #rad, was 0.2: same reasoning, still well under the 1.57 rad framework default
    COLOR_JITTER: [0.1, 0.1, 0.05, 0.02]  # gentle: strong jitter can erase wetness/sheen cues
