# Not generated by make_eval_grid.py: extra arm, all-data variant of the baseline.
TAG: gt_all_missions_f2
DESCRIPTION: Baseline recipe on every labelled mission except the f2 valid set, SNOW and KAEB-1 (40 missions,
  4x the f2 train data). Tests whether data volume and environment diversity regularize the mu collapse.
  Valid set unchanged, so numbers stay comparable.
OPTIMIZER:
  LR: 0.0001
  LR_REF_BATCHSIZE: 12
  WEIGHT_DECAY: 0.0001
  BACKBONE_LR_FACTOR: 1.0
TRAINING:
  BATCHSIZE: 8
  WORKERS: 20
  DEVICES:
  - 0
  EPOCHS: 10
  VAL_CHECK_INTERVAL: 484
  CHECKPOINT_EVERY_N_EPOCHS: 10
  VERBOSE: false
  GAMMA: 1.0
  LOSS_NORM: mean
  DEPTH_WEIGHT: 0.05
  HORIZON: 300
  DT: 0.1
  VIS_INTERVAL: 500
  DEBUG_VIS_LABELS: true
  DEBUG_VIS_GEOM: true
  DEBUG_VIS_DEPTH: true
  CHECKPOINT_EVERY_N_VALIDATIONS: 2
  CKPT_MONITOR: valid_mission/calib_slope
  CKPT_MODE: max
  VIS_PANELS_SKIP:
  - bev_outputs
  - bev_label
  - geom_frames
  - images
  CHECKPOINT_DENSE_EPOCHS: 1
MODEL:
  TIME_LENGTH: 6
  DOWNSAMPLE: 8
  LATENT_DIM: 64
  INPUT_SIZE:
  - 480
  - 360
  PREDICT_DEPTH: true
  TRAIN_DEPTH: true
  FUSE_PCLOUD: true
  VOXEL_DEPTH_DOWNSAMPLE: 1
  LABEL_COLUMNS:
  - 0
  - 1
  GRID_BOUNDS:
    xbound:
    - -2.0
    - 8.0
    - 0.1
    ybound:
    - -5.0
    - 5.0
    - 0.1
    zbound:
    - -1.5
    - 1.5
    - 0.2
    dbound:
    - 0.3
    - 8.0
    - 0.2
DATASET:
  DATA_ROOT: /datahome/lmertens/grand_tour_dataset/extracted
  LABELS_ROOT: /datahome/lmertens/grand_tour_dataset/labels
  RESIZED_ROOT: /datalocal/lmertens/grand_tour_dataset_resized
  TIME_TOLERANCE: 0.05
  MAX_TIME_GAP: 0.5
  FRAME_STRIDE: 5
  WINDOW_STRIDE: 5
  LDS_ALPHA: 1.0
  VISIBILITY_GATE: false
  OVERSAMPLE_FRACTION: 0.0
  TRAIN_MISSIONS:
  - ALB-1
  - ALB-2
  - ARC-1
  - ARC-2
  - ARC-3
  - ARC-4
  - ARC-5
  - ARC-6
  - ARC-7
  - CON-1
  - CON-2
  - CON-3
  - CON-4
  - CYN-1
  - CYN-2
  - EIG-1
  - EIG-2
  - ETH-1
  - ETH-2
  - ETH-3
  - GRI-1
  - HAUS-1
  - HEAP-1
  - HOEB-1
  - HOEB-2
  - KAEB-3
  - LEE-1
  - LEICA-1
  - LEICA-2
  - LMB-1
  - LMB-2
  - PIL-1
  - PIL-2
  - ROOT-1
  - SBB-1
  - SBB-2
  - SPX-1
  - SPX-2
  - SPX-3
  - TRIM-1
  VALID_MISSIONS:
  - RIV-1
  - ALB-3
  - HIL-1
  - KAEB-2
  TEST_MISSIONS:
