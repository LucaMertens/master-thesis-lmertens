TAG: 'gt_human_f2_s45'
DESCRIPTION: 'Seed replicate 45 of gt_human_f2, for the error bar on the human-supervised row. Identical to it but for SEED, the card it runs on, and CKPT_MONITOR, which follows the metric rename valid/human_hdr -> human/valid_hdr: same quantity (balanced HDR at the headline tau), the key gt_human_f2 selected on no longer exists. CV fold f2, W-RIZZ: the human pairwise labels are the ONLY traversability supervision (TRAV_WEIGHT 0). No RHE label reaches a gradient or the checkpoint monitor; the RHE metrics still log, read-only, so this is directly comparable to gt_baseline_f2. Depth keeps its own stereo target. 20 epochs.'

OPTIMIZER:
    LR: 0.0001
    LR_REF_BATCHSIZE: 12
    WEIGHT_DECAY: 0.0001
    BACKBONE_LR_FACTOR: 1.0

TRAINING:
    BATCHSIZE: 8
    WORKERS: 6
    DEVICES: [2]        # the human batch sampler emits one epoch, not one shard per rank
    EPOCHS: 20
    VAL_CHECK_INTERVAL: 0.25
    CHECKPOINT_EVERY_N_EPOCHS: 10
    CHECKPOINT_EVERY_N_VALIDATIONS: 2
    CHECKPOINT_DENSE_EPOCHS: 2
    VERBOSE: False
    GAMMA: 1.0
    LOSS_NORM: 'mean'
    DEPTH_WEIGHT: 0.05
    HORIZON: 300
    DT: 0.1
    VIS_INTERVAL: 500
    DEBUG_VIS_LABELS: True
    DEBUG_VIS_GEOM: True
    DEBUG_VIS_DEPTH: True

    # RHE off as a training signal: no gradient, and the checkpoint monitor is the
    # human metric. valid/calib_slope, valid/hdr and the confusion panels still log,
    # which is what makes this run readable next to the RHE-trained baseline.
    # The nu channel is unsupervised as a consequence; W-RIZZ predicts one score.
    TRAV_WEIGHT: 0.0

    # Human pairwise supervision, the whole traversability objective here. The
    # HUMAN_WEIGHT / LOSS_TYPE orthogonality still holds, it is simply not exercised:
    # setting TRAV_WEIGHT back to 1.0 gives the summed variant with no other change.
    HUMAN_WEIGHT: 1.0
    HUMAN_TARGET: 'bev'
    HUMAN_MARGIN: 0.5    # W-RIZZ's L, grid-searched to 0.5 in the paper
    HUMAN_K: 5
    HUMAN_ANCHOR_MASS: 0.4
    HUMAN_INEQ_FRACTION: 0.5

    # The run's own question: does the network order the pairs a human ordered.
    # Balanced, so the 55% tie share cannot carry the number on its own.
    CKPT_MONITOR: 'human/valid_hdr'
    CKPT_MODE: 'min'

MODEL:
    TIME_LENGTH: 6
    DOWNSAMPLE: 8
    LATENT_DIM: 64
    INPUT_SIZE: [480, 360]
    PREDICT_DEPTH: True
    TRAIN_DEPTH: True
    FUSE_PCLOUD: True
    VOXEL_DEPTH_DOWNSAMPLE: 1
    LABEL_COLUMNS: [0, 1]
    GRID_BOUNDS: {
        'xbound': [-2.0, 8.0, 0.1],
        'ybound': [-5.0, 5.0, 0.1],
        'zbound': [-1.5, 1.5, 0.2],
        'dbound': [ 0.3, 8.0, 0.2]}

DATASET:
    DATA_ROOT: '/datahome/lmertens/grand_tour_dataset/extracted'
    LABELS_ROOT: '/datahome/lmertens/grand_tour_dataset/labels'
    RESIZED_ROOT: '/datalocal/lmertens/grand_tour_dataset_resized'
    TIME_TOLERANCE: 0.05
    MAX_TIME_GAP: 0.5
    FRAME_STRIDE: 5
    WINDOW_STRIDE: 5
    LDS_ALPHA: 1.0
    VISIBILITY_GATE: False
    OVERSAMPLE_FRACTION: 0.0

    # Cross-validation fold f2. The export gate keys on exactly this list: the 506
    # pairs with an endpoint in a valid mission are eval-only and never enter the loss.
    TRAIN_MISSIONS: ['ALB-1', 'ALB-2', 'CYN-1', 'CYN-2', 'HOEB-1', 'HOEB-2', 'LMB-1', 'LMB-2', 'TRIM-1', 'KAEB-3']
    VALID_MISSIONS: ['RIV-1', 'ALB-3', 'HIL-1', 'KAEB-2']
    TEST_MISSIONS:  ['RIV-1', 'ALB-3', 'HIL-1', 'KAEB-2']

AUGMENTATIONS:
    HORIZ_FLIP: 0.5
    PCLOUD_DROPOUT: 0.3
    MAX_TRANSLATION: 0.0
    MAX_ROTATION: 0.0
    COLOR_JITTER: [0.0, 0.0, 0.0, 0.0]

SEED: 45
