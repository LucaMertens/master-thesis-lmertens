[project]
name = "traversability_network"
version = "0.1.0"
description = "WayFASTER traversability network adapted to the ANYmal GrandTour dataset."
requires-python = "==3.14.*"
dependencies = [
    "torch",
    "torchvision",
    "pytorch-lightning",
    "kornia",
    "numpy",
    "scipy",
    "opencv-python-headless",
    "pandas",
    "easydict",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "wandb",
    "data_labeling_pipeline",
    "config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traversability_network"]

[tool.uv.sources]
data_labeling_pipeline = { workspace = true }
config = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "tier1: geometry checks (path coverage, heading consistency)",
    "tier2: fast CPU/GPU guards (gradients, labels, velocity, overfit)",
    "tier3: robustness checks (flip, dataset sweep, depth health)",
]
