[project]
name = "shared-utils"
version = "0.1.0"
description = "Shared filesystem paths, evaluation tiers and dataset helpers."
requires-python = "==3.14.*"
dependencies = ["numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_utils"]
